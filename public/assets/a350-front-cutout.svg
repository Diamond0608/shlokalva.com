<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Airbus A350 front-view aircraft">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9faab3"/><stop offset=".22" stop-color="#f4f7f9"/>
      <stop offset=".5" stop-color="#ffffff"/><stop offset=".78" stop-color="#e8edf0"/><stop offset="1" stop-color="#9da8b1"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5f7f9"/><stop offset=".65" stop-color="#c5cdd3"/><stop offset="1" stop-color="#7e8a94"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#707c86"/><stop offset=".45" stop-color="#eef1f3"/><stop offset="1" stop-color="#59656f"/>
    </linearGradient>
    <radialGradient id="glass"><stop stop-color="#355365"/><stop offset=".65" stop-color="#101e28"/><stop offset="1" stop-color="#05090d"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- broad, level front-view wings -->
    <path d="M526 300 L190 360 L82 395 Q68 402 82 412 L112 420 L526 344 Z" fill="url(#wing)"/>
    <path d="M674 300 L1010 360 L1118 395 Q1132 402 1118 412 L1088 420 L674 344 Z" fill="url(#wing)"/>
    <!-- engine nacelles -->
    <ellipse cx="310" cy="390" rx="82" ry="57" fill="url(#engine)"/>
    <ellipse cx="890" cy="390" rx="82" ry="57" fill="url(#engine)"/>
    <ellipse cx="310" cy="390" rx="59" ry="40" fill="#101820"/>
    <ellipse cx="890" cy="390" rx="59" ry="40" fill="#101820"/>
    <ellipse cx="310" cy="390" rx="38" ry="26" fill="#05080b"/>
    <ellipse cx="890" cy="390" rx="38" ry="26" fill="#05080b"/>
    <ellipse cx="310" cy="390" rx="15" ry="10" fill="#687680"/>
    <ellipse cx="890" cy="390" rx="15" ry="10" fill="#687680"/>
    <!-- fuselage -->
    <path d="M600 62 C562 64 538 96 528 145 L506 290 L520 505 C526 552 558 586 600 604 C642 586 674 552 680 505 L694 290 L672 145 C662 96 638 64 600 62 Z" fill="url(#body)"/>
    <!-- cockpit -->
    <path d="M536 172 C550 125 573 102 600 100 C627 102 650 125 664 172 L650 214 C633 199 618 191 600 191 C582 191 567 199 550 214 Z" fill="url(#glass)"/>
    <path d="M550 216 Q600 190 650 216 L644 244 Q600 228 556 244 Z" fill="#101820"/>
    <!-- lower fuselage -->
    <path d="M548 252 Q600 235 652 252 L646 274 Q600 263 554 274 Z" fill="#f5f7f8" opacity=".8"/>
    <path d="M540 320 L520 505 Q528 551 550 567 L600 586 L650 567 Q672 551 680 505 L660 320 Q600 342 540 320 Z" fill="#e5eaed" opacity=".95"/>
    <!-- lower wing/fuselage fairings -->
    <path d="M525 320 L245 375 L190 405 L525 347 Z" fill="#9da8b1" opacity=".65"/>
    <path d="M675 320 L955 375 L1010 405 L675 347 Z" fill="#9da8b1" opacity=".65"/>
    <!-- nose gear -->
    <path d="M570 555 L600 535 L630 555 L618 585 L600 600 L582 585 Z" fill="#b8c2c9"/>
    <path d="M586 582 L600 592 L614 582 L610 615 L600 624 L590 615 Z" fill="#707c86"/>
    <!-- small navigation lights -->
    <circle cx="205" cy="397" r="4" fill="#fff"/>
    <circle cx="995" cy="397" r="4" fill="#fff"/>
  </g>
</svg>