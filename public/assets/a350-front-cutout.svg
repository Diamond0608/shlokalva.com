<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-label="Realistic front-view passenger aircraft">
  <!-- Aircraft artwork: Vecteezy free PNG, resource 50232474, attribution required. -->
  <g transform="translate(512 288) scale(.68) translate(-512 -288)">
    <animateTransform
      attributeName="transform"
      type="scale"
      additive="replace"
      values=".68;.78;.92;1.02;.92;.78;.68"
      keyTimes="0;.12;.32;.48;.66;.84;1"
      dur="4.8s"
      repeatCount="indefinite"
    />
    <image
      href="https://static.vecteezy.com/system/resources/previews/050/232/474/non_2x/airplane-front-view-isolated-transparent-background-free-png.png"
      x="0"
      y="0"
      width="1024"
      height="576"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>
</svg>