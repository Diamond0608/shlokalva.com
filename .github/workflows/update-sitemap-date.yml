name: Update Last Updated Date

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-last-updated-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update sitemap and visible cockpit date
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          DISPLAY_DATE=$(TZ=Asia/Kolkata date '+%-d %b %Y' | tr '[:lower:]' '[:upper:]')

          sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>$TODAY</lastmod>#" public/sitemap.xml
          sed -i -E "s#LAST UPDATED ON <b>[0-9]{1,2} [A-Z]{3} [0-9]{4}</b>#LAST UPDATED ON <b>$DISPLAY_DATE</b>#" src/main.tsx

      - name: Commit date if changed
        run: |
          if git diff --quiet -- public/sitemap.xml src/main.tsx; then
            echo "Dates are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml src/main.tsx
          git commit -m "Update last updated date [skip ci]"
          git push
