name: Update Sitemap Date

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-sitemap-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update last modified date
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>$TODAY</lastmod>#" public/sitemap.xml

      - name: Commit date if changed
        run: |
          if git diff --quiet -- public/sitemap.xml; then
            echo "Sitemap date is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git commit -m "Update sitemap last modified date [skip ci]"
          git push
