name: Prepare project media

on:
  push:
    paths:
      - "untitled.glb"
      - "untitled.rar"
      - "scene (1).rar"
      - "littlehelper.pdf"
      - "image_2026-09-18_132632793.png"
      - "WhatsApp Video *.mp4"
      - ".github/workflows/convert-project-assets.yml"

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full poppler-utils

      - name: Prepare uploaded GLB and project media
        shell: bash
        run: |
          set -e
          mkdir -p public/assets
          rm -rf /tmp/project-assets
          mkdir -p /tmp/project-assets

          # Little Helper: use the final uploaded GLB directly. No CAD conversion.
          if [ -f "untitled.glb" ]; then
            cp "untitled.glb" public/assets/little-helper.glb
          elif [ -f "untitled.rar" ]; then
            7z x "untitled.rar" -o/tmp/project-assets/little-helper -y
            LH="$(find /tmp/project-assets/little-helper -type f -iname '*.glb' | head -n 1 || true)"
            if [ -n "$LH" ]; then
              cp "$LH" public/assets/little-helper.glb
            else
              echo "untitled.rar did not contain a GLB; leaving the existing Little Helper model untouched."
            fi
          else
            echo "No Little Helper GLB upload in this commit; leaving the existing model untouched."
          fi

          # Trinetra: accept an already-built GLB from the scene archive. No conversion.
          if [ -f "scene (1).rar" ]; then
            7z x "scene (1).rar" -o/tmp/project-assets/trinetra -y
            TR="$(find /tmp/project-assets/trinetra -type f -iname '*.glb' | head -n 1 || true)"
            if [ -n "$TR" ]; then
              cp "$TR" public/assets/trinetra.glb
            else
              echo "scene (1).rar did not contain a GLB; no Trinetra conversion will be attempted."
            fi
          fi

          if [ -f "littlehelper.pdf" ]; then
            pdftoppm -png -f 1 -singlefile -r 120 "littlehelper.pdf" /tmp/project-assets/littlehelper-preview
            cp /tmp/project-assets/littlehelper-preview.png public/assets/littlehelper-preview.png
          fi

          if [ -f "image_2026-09-18_132632793.png" ]; then
            cp "image_2026-09-18_132632793.png" public/assets/image_2026-09-18_132632793.png
          fi

      - name: Prepare uploaded project videos
        shell: bash
        run: |
          set -e
          mkdir -p public/assets

          if [ -f "WhatsApp Video 2026-09-18 at 1.00.44 PM.mp4" ]; then
            cp "WhatsApp Video 2026-09-18 at 1.00.44 PM.mp4" public/assets/rc-plane-detail.mp4
          fi

          if [ -f "WhatsApp Video 2026-09-18 at 1.03.08 PM.mp4" ]; then
            input="WhatsApp Video 2026-09-18 at 1.03.08 PM.mp4"
            output="public/assets/rc-plane-moving-reversed.mp4"
            if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$input" | grep -q .; then
              ffmpeg -y -i "$input" -vf reverse -af areverse -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$output"
            else
              ffmpeg -y -i "$input" -vf reverse -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart "$output"
            fi
          fi

          if [ -f "WhatsApp Video 2026-09-18 at 1.02.12 PM.mp4" ]; then
            cp "WhatsApp Video 2026-09-18 at 1.02.12 PM.mp4" public/assets/team-dinoco-video.mp4
          fi

      - name: Commit generated assets
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for asset in             public/assets/little-helper.glb             public/assets/trinetra.glb             public/assets/littlehelper-preview.png             public/assets/image_2026-09-18_132632793.png             public/assets/rc-plane-detail.mp4             public/assets/rc-plane-moving-reversed.mp4             public/assets/team-dinoco-video.mp4; do
            if [ -f "$asset" ]; then git add "$asset"; fi
          done

          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi

          git commit -m "Prepare project media"
          git pull --rebase origin main
          git push
