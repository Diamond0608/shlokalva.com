name: Convert project CAD assets

on:
  push:
    paths:
      - "Little Helper Main.rar"
      - "Trinetra.rar"
      - "littlehelper.pdf"
      - ".github/workflows/convert-project-assets.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full poppler-utils blender python3-venv python3-numpy
          python3 -m venv /tmp/cq
          /tmp/cq/bin/pip install cadquery

      - name: Extract archives and inspect the real project files
        shell: bash
        run: |
          set -e
          rm -rf /tmp/little-helper /tmp/trinetra /tmp/converted
          mkdir -p /tmp/little-helper /tmp/trinetra /tmp/converted

          7z x "Little Helper Main.rar" -o/tmp/little-helper -y
          7z x "Trinetra.rar" -o/tmp/trinetra -y

          for root in /tmp/little-helper /tmp/trinetra; do
            while IFS= read -r -d '' archive; do
              dest="${archive%.*}_extracted"
              mkdir -p "$dest"
              7z x "$archive" -o"$dest" -y || true
            done < <(find "$root" -type f \( -iname '*.rar' -o -iname '*.zip' -o -iname '*.7z' \) -print0)
          done

          echo "===== LITTLE HELPER: actual files inside archive ====="
          find /tmp/little-helper -type f -printf '%p\n' | sort
          echo "===== TRINETRA: actual files inside archive ====="
          find /tmp/trinetra -type f -printf '%p\n' | sort

      - name: Convert STEP/STP source files to STL
        shell: bash
        run: |
          set -e
          for root in /tmp/little-helper /tmp/trinetra; do
            while IFS= read -r -d '' step; do
              base="$(basename "$step")"
              safe="$(echo "$base" | tr ' /' '__')"
              /tmp/cq/bin/python -c 'import sys,cadquery as cq; model=cq.importers.importStep(sys.argv[1]); cq.exporters.export(model,sys.argv[2],cq.exporters.ExportTypes.STL)' "$step" "/tmp/converted/$safe.stl"
            done < <(find "$root" -type f \( -iname '*.step' -o -iname '*.stp' \) -print0)
          done
          find /tmp/converted -type f -name '*.stl' -print | sort || true

      - name: Convert the actual project model files to GLB
        shell: bash
        run: |
          set -e
          convert_with_blender() {
            input="$1"
            output="$2"
            PYTHONPATH=/usr/lib/python3/dist-packages blender -b --python-expr "import bpy,sys; p=sys.argv[-2]; o=sys.argv[-1]; bpy.ops.wm.read_factory_settings(use_empty=True); ext=p.lower().rsplit('.',1)[-1]; fn={'stl':bpy.ops.import_mesh.stl,'obj':bpy.ops.wm.obj_import,'fbx':bpy.ops.import_scene.fbx,'dae':bpy.ops.wm.collada_import}[ext]; fn(filepath=p); total=sum(len(x.data.polygons) for x in bpy.context.scene.objects if x.type=='MESH'); print('Imported polygons:',total); ratio=min(1.0,500000/max(total,1)); [((lambda mod: (setattr(mod,'ratio',ratio),bpy.context.view_layer.objects.active.__setattr__('active_material_index',bpy.context.view_layer.objects.active.active_material_index) if False else None, bpy.context.view_layer.objects.active.__setattr__('active_material_index',0) if False else None, bpy.context.view_layer.objects.active.select_set(True), bpy.ops.object.modifier_apply(modifier=mod.name)))(o.modifiers.new(name='PortfolioSimplify',type='DECIMATE'))) for o in bpy.context.scene.objects if o.type=='MESH' and len(o.data.polygons)>500000]; bpy.ops.object.select_all(action='SELECT'); bpy.ops.export_scene.gltf(filepath=o, export_format='GLB', export_yup=True); print('GLB exported:',o)" -- "$input" "$output"
          }
          find_source() {
            root="$1"
            find "$root" -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.stl' -o -iname '*.obj' -o -iname '*.fbx' -o -iname '*.dae' \) -print | head -n 1
          }
          LH="$(find_source /tmp/little-helper || true)"
          TR="$(find_source /tmp/trinetra || true)"
          if [ -z "$LH" ]; then LH="$(find /tmp/converted -type f -name '*.stl' | head -n 1 || true)"; fi
          if [ -z "$TR" ]; then TR="$(find /tmp/converted -type f -name '*.stl' | tail -n 1 || true)"; fi
          echo "Little Helper conversion source: $LH"
          echo "Trinetra conversion source: $TR"
          [ -n "$LH" ] || { echo "No Little Helper model source found."; exit 1; }
          [ -n "$TR" ] || { echo "No Trinetra model source found."; exit 1; }
          convert_one() {
            input="$1"
            output="$2"
            ext="${input##*.}"
            if [ "${ext,,}" = "glb" ]; then
              cp "$input" "$output"
            else
              convert_with_blender "$input" "$output"
            fi
          }
          convert_one "$LH" /tmp/converted/little-helper.glb
          convert_one "$TR" /tmp/converted/trinetra.glb
          ls -lh /tmp/converted/*.glb

      - name: Make Little Helper PDF preview
        shell: bash
        run: |
          mkdir -p public/assets
          if [ -f "littlehelper.pdf" ]; then
            if pdftoppm -png -f 1 -singlefile -r 120 "littlehelper.pdf" /tmp/converted/littlehelper-preview; then
              cp /tmp/converted/littlehelper-preview.png public/assets/littlehelper-preview.png
              echo "PDF preview created."
            else
              echo "PDF preview generation failed; continuing because the GLB assets are valid."
            fi
          else
            echo "littlehelper.pdf not found; skipping preview."
          fi

          cp /tmp/converted/little-helper.glb public/assets/little-helper.glb
          cp /tmp/converted/trinetra.glb public/assets/trinetra.glb

      - name: Commit generated assets
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/little-helper.glb public/assets/trinetra.glb
          if [ -f public/assets/littlehelper-preview.png ]; then
            git add public/assets/littlehelper-preview.png
          fi
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
          else
            git commit -m "Add project GLB models and Little Helper preview"
            # Another workflow run can update main while conversion is running.
            # Rebase the generated-assets commit before pushing so the workflow
            # does not fail just because the site changed concurrently.
            git pull --rebase origin main
            git push
          fi
