name: Prepare project media

on:
  push:
    paths:
      - "untitled.glb"
      - "untitled.rar"
      - "scene (1).rar"
      - "littlehelper.pdf"
      - "image_2026-09-18_132632793.png"
      - "WhatsApp Video *.mp4"
      - "Video Project 2.mp4"
            - ".github/workflows/convert-project-assets.yml"

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install archive and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full poppler-utils
          npm install --global @gltf-transform/cli

      - name: Prepare uploaded GLB and project media
        shell: bash
        run: |
          set -e
          mkdir -p public/assets
          rm -rf /tmp/project-assets
          mkdir -p /tmp/project-assets

          # Little Helper: use the uploaded GLB directly. No CAD conversion.
          if [ -f "untitled.glb" ]; then
            cp "untitled.glb" public/assets/little-helper.glb
          elif [ -f "untitled.rar" ]; then
            7z x "untitled.rar" -o/tmp/project-assets/little-helper -y
            LH="$(find /tmp/project-assets/little-helper -type f -iname '*.glb' | head -n 1 || true)"
            if [ -n "$LH" ]; then
              gltf-transform optimize "$LH" public/assets/little-helper.glb --compress draco
            else
              echo "untitled.rar did not contain a GLB; leaving the existing Little Helper model untouched."
            fi
          fi

          # Trinetra: use the uploaded GLB from the archive directly. No conversion.
          if [ -f "scene (1).rar" ]; then
            7z x "scene (1).rar" -o/tmp/project-assets/trinetra -y
            TR="$(find /tmp/project-assets/trinetra -type f -iname '*.glb' | head -n 1 || true)"
            if [ -n "$TR" ]; then
              gltf-transform optimize "$TR" public/assets/trinetra.glb --compress draco
            else
              echo "scene (1).rar did not contain a GLB; leaving the existing Trinetra model untouched."
            fi
          fi

          if [ -f "littlehelper.pdf" ]; then
            pdftoppm -png -f 1 -singlefile -r 120 "littlehelper.pdf" /tmp/project-assets/littlehelper-preview
            cp /tmp/project-assets/littlehelper-preview.png public/assets/littlehelper-preview.png
          fi

          if [ -f "image_2026-09-18_132632793.png" ]; then
            cp "image_2026-09-18_132632793.png" public/assets/image_2026-09-18_132632793.png
          fi

      - name: Copy uploaded project videos unchanged
        shell: bash
        run: |
          set -e
          mkdir -p public/assets

          if [ -f "WhatsApp Video 2026-09-18 at 1.00.44 PM.mp4" ]; then
            cp "WhatsApp Video 2026-09-18 at 1.00.44 PM.mp4" public/assets/team-dinoco-video.mp4
          fi

          # User supplies the already-reversed Project 2 video. Copy it unchanged; do not process it.
          test -f "Video Project 2.mp4"
          cp "Video Project 2.mp4" public/assets/plane-video.mp4

          if [ -f "WhatsApp Video 2026-09-18 at 1.02.12 PM.mp4" ]; then
            cp "WhatsApp Video 2026-09-18 at 1.02.12 PM.mp4" public/assets/rc-plane-detail.mp4
          fi

      - name: Commit generated assets
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for asset in             public/assets/little-helper.glb             public/assets/trinetra.glb             public/assets/littlehelper-preview.png             public/assets/image_2026-09-18_132632793.png             public/assets/rc-plane-detail.mp4             public/assets/plane-video.mp4             public/assets/team-dinoco-video.mp4; do
            if [ -f "$asset" ]; then git add "$asset"; fi
          done

          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi

          git commit -m "Prepare project media"
          git pull --rebase origin main
          git push
