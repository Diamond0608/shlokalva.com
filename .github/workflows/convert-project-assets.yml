name: Convert project CAD assets

on:
  push:
    paths:
      - "Little Helper Main.rar"
      - "Trinetra.rar"
      - "littlehelper.pdf"
      - ".github/workflows/convert-project-assets.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full poppler-utils blender freecad

      - name: Extract archives and inspect the real project files
        shell: bash
        run: |
          set -e
          rm -rf /tmp/little-helper /tmp/trinetra /tmp/converted
          mkdir -p /tmp/little-helper /tmp/trinetra /tmp/converted

          7z x "Little Helper Main.rar" -o/tmp/little-helper -y
          7z x "Trinetra.rar" -o/tmp/trinetra -y

          # Also unpack any archives nested inside the supplied RARs.
          for root in /tmp/little-helper /tmp/trinetra; do
            for archive in $(find "$root" -type f \( -iname '*.rar' -o -iname '*.zip' -o -iname '*.7z' \)); do
              dest="${archive%.*}_extracted"
              mkdir -p "$dest"
              7z x "$archive" -o"$dest" -y || true
            done
          done

          echo "===== LITTLE HELPER: actual files inside archive ====="
          find /tmp/little-helper -type f -printf '%p\n' | sort
          echo "===== TRINETRA: actual files inside archive ====="
          find /tmp/trinetra -type f -printf '%p\n' | sort

      - name: Convert STEP/STP source files to STL
        shell: bash
        run: |
          set -e
          for root in /tmp/little-helper /tmp/trinetra; do
            find "$root" -type f \( -iname '*.step' -o -iname '*.stp' \) -print0 |
            while IFS= read -r -d '' step; do
              base="$(basename "$step")"
              safe="$(echo "$base" | tr ' /' '__')"
              python3 -c 'import sys, FreeCAD, Part, Mesh; src=sys.argv[1]; dst=sys.argv[2]; doc=FreeCAD.newDocument("Conversion"); shape=Part.read(src); assert not shape.isNull(), "Invalid STEP shape"; obj=doc.addObject("Part::Feature","ImportedShape"); obj.Shape=shape; doc.recompute(); Mesh.export([obj],dst); FreeCAD.closeDocument(doc.Name)' "$step" "/tmp/converted/$safe.stl"
            done
          done
          find /tmp/converted -type f -name '*.stl' -print | sort || true

      - name: Convert the actual project model files to GLB
        shell: bash
        run: |
          set -e
          convert_with_blender() {
            input="$1"
            output="$2"
            blender -b --python-expr "import bpy,sys; p=sys.argv[-2]; o=sys.argv[-1]; bpy.ops.wm.read_factory_settings(use_empty=True); ext=p.lower().rsplit('.',1)[-1]; fn={'stl':bpy.ops.import_mesh.stl,'obj':bpy.ops.wm.obj_import,'fbx':bpy.ops.import_scene.fbx,'dae':bpy.ops.wm.collada_import}[ext]; fn(filepath=p); bpy.ops.object.select_all(action='SELECT'); bpy.ops.export_scene.gltf(filepath=o, export_format='GLB', export_yup=True)" -- "$input" "$output"
          }
          find_source() {
            root="$1"
            find "$root" -type f \( -iname '*.stl' -o -iname '*.obj' -o -iname '*.fbx' -o -iname '*.dae' -o -iname '*.glb' -o -iname '*.gltf' \) -print | head -n 1
          }
          LH="$(find_source /tmp/little-helper || true)"
          TR="$(find_source /tmp/trinetra || true)"
          if [ -z "$LH" ]; then LH="$(find /tmp/converted -type f -name '*.stl' | head -n 1 || true)"; fi
          if [ -z "$TR" ]; then TR="$(find /tmp/converted -type f -name '*.stl' | tail -n 1 || true)"; fi
          echo "Little Helper conversion source: $LH"
          echo "Trinetra conversion source: $TR"
          [ -n "$LH" ] || { echo "No Little Helper model source found."; exit 1; }
          [ -n "$TR" ] || { echo "No Trinetra model source found."; exit 1; }
          convert_one() {
            input="$1"
            output="$2"
            ext="${input##*.}"
            if [ "${ext,,}" = "glb" ]; then
              cp "$input" "$output"
            else
              convert_with_blender "$input" "$output"
            fi
          }
          convert_one "$LH" /tmp/converted/little-helper.glb
          convert_one "$TR" /tmp/converted/trinetra.glb

      - name: Make Little Helper PDF preview
        run: |
          set -e
          mkdir -p public/assets
          pdftoppm -png -f 1 -singlefile -r 120 littlehelper.pdf /tmp/converted/littlehelper-preview
          cp /tmp/converted/littlehelper-preview.png public/assets/littlehelper-preview.png
          cp /tmp/converted/little-helper.glb public/assets/little-helper.glb
          cp /tmp/converted/trinetra.glb public/assets/trinetra.glb

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/little-helper.glb public/assets/trinetra.glb public/assets/littlehelper-preview.png
          git diff --cached --quiet || git commit -m "Add project GLB models and Little Helper preview"
          git push
