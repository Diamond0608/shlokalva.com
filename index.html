        <h1>Shlok Alva — Robotics, Aerospace &amp; Engineering Portfolio</h1>
        <p>I am Shlok Alva. This is my engineering portfolio covering robotics, aerospace, CAD, software, embedded systems, aircraft propulsion, and hands-on builds.</p>
        <h2>Projects</h2>
        <ul>
          <li><strong>Little Helper</strong> — a track-based teacher book-carrying robot built from CAD through electronics, code, and physical testing.</li>
          <li><strong>Team Dinoco</strong> — my National Robotics League competition work as team captain, including mechanical build work, coordination, strategy, and competition preparation.</li>
          <li><strong>Aircraft Propulsion Internship</strong> — my Dwello Aerospace work on ramjet and turbofan CAD, calculations, simulation, animation, and technical reporting.</li>
          <li><strong>Trinetra</strong> — my wearable-tech CAD and mechanism-design project.</li>
          <li><strong>Self-Made RC Plane</strong> — my scratch-built aviation project using a NACA 0012 airfoil and iterative design.</li>
        </ul>
        <h2>Focus</h2>
